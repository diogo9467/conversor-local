name: Android offline converter
on:
  push:
    branches: [main, codex/android-offline]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned native toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Prepare pinned Android engines
        run: |
          python android/tools/prepare_engines.py
          chmod +x android/gradlew
      - name: Build ARM64 test APK and run JVM checks
        working-directory: android
        run: |
          ./gradlew assembleDebug testDebugUnitTest lintDebug --console=plain
          mkdir -p ../artifacts/android
          cp app/build/outputs/apk/debug/app-debug.apk ../artifacts/android/ConversorLocal-android-0.1.0-arm64-debug.apk
          python tools/verify_apk.py ../artifacts/android/ConversorLocal-android-0.1.0-arm64-debug.apk --abi arm64-v8a --report ../artifacts/android/apk-verification.json
          sha256sum ../artifacts/android/*.apk > ../artifacts/android/SHA256SUMS.txt
      - name: Enable KVM for the isolated CI emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android x86_64 tests in airplane mode
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell cmd connectivity airplane-mode enable
            adb shell svc wifi disable
            adb shell svc data disable
            cd android && ./gradlew connectedDebugAndroidTest -Pabis=x86_64 --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-ARM64-debug-and-tests
          path: |
            artifacts/android/*
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
            android/app/build/test-results/
